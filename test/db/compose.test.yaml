services:
  postgres:
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql

  db-test:
    image: postgres:18.6-bookworm
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-basejudge}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-basejudge}
    volumes:
      - ./test/db:/tests:ro
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1"]
    command: ["-f", "/tests/all.sql"]
